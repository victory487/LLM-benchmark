# AA-aligned GDPval：Qwen3.6-35B-A3B（一模型一配置）
# 用法：
#   ./.venv/bin/python gen_aligned.py --model Qwen3.6-35B-A3B
#   ./.venv/bin/python judge_aligned_gpt55.py --model Qwen3.6-35B-A3B
#
# 隔离：产物 tasks/*/cand_Qwen3.6-35B-A3B_aligned/ ；结果 judge_aligned_Qwen3.6-35B-A3B_results.json
#
# 测试集切换（二选一）：
#   config.json          — 原版 220 题（需 Brave 跑全量）
#   config_no_brave.json — 去掉 14 个强依赖 web_search 的题，剩 206 题

tasks_file: config_no_brave.json

candidate:
  model: Qwen3.6-35B-A3B
  base_url: http://10.0.3.35:8005/v1
  api_key: "x"

brave_api_key: ""

gen:
  n_samples: 3
  workers: 12
  max_turns: 250
  max_tokens: 48000
  temperature: 1.0
  top_k: 20
  top_p: 0.95

judge:
  model: gpt-5.5
  base_url: https://agrouter-ng-test.kiwiar.com/v1
  api_key: sk-bfU2MvaVuZ0jW7wB53qJKw
  n_samples: 3
  workers: 4
  max_pages: 12
  # materials-rich judge (full prompt + refs + zip); keeps old results file untouched
  results_file: judge_aligned_{model}_materials_results.json

round1:
  results_file: round1_{model}_results.json
