[project]
name = "gdpval-bench"
version = "0.1.0"
description = "AA-aligned GDPval evaluation harness (Stirrup generation + multimodal judge)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  # Agent harness (AA Stirrup)
  "stirrup>=0.1.12",
  "e2b>=2.36.0",
  "e2b-code-interpreter>=2.9.0",
  # LLM clients / config
  "openai>=2.45.0",
  "httpx>=0.28.0",
  "pyyaml>=6.0.3",
  # Deliverable parsing for judge
  "openpyxl>=3.1.5",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  # pillow upper bound required by stirrup -> moviepy
  "pillow>=9.2.0,<12.0",
  "pdf2image>=1.17.0",
  # Dataset download helpers
  "datasets>=5.0.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
# Extra libs sometimes used inside agent code_exec on tasks (not required to start gen/judge).
task-runtime = [
  "numpy>=2.0.0",
  "pandas>=2.0.0",
  "matplotlib>=3.8.0",
  "scipy>=1.11.0",
  "reportlab>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
package = false
