# 新模型配置模板：复制为 aligned_<model>.yaml 后改 candidate / sampling
# 例：cp aligned_TEMPLATE.yaml aligned_MyModel-v1.yaml
#
# 用法：
#   ./.venv/bin/python gen_aligned.py --model MyModel-v1
#   ./.venv/bin/python judge_aligned_gpt55.py --model MyModel-v1

# 测试集：config.json（220）或 config_no_brave.json（206，去掉需 Brave 的 14 题）
tasks_file: config_no_brave.json

candidate:
  model: REPLACE_MODEL_ID
  base_url: http://HOST:PORT/v1
  api_key: "x"

brave_api_key: ""

gen:
  n_samples: 3
  workers: 12
  max_turns: 22
  max_tokens: 48000
  # 按模型官方推荐填写；不写则用服务端默认
  # temperature: 0.6
  # top_p: 0.95
  # repetition_penalty: 1.0

judge:
  model: gpt-5.5
  base_url: https://agrouter-ng-test.kiwiar.com/v1
  api_key: sk-bfU2MvaVuZ0jW7wB53qJKw
  n_samples: 3
  workers: 4
  max_pages: 12
  results_file: judge_aligned_{model}_results.json

round1:
  results_file: round1_{model}_results.json
